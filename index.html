<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="Matteo Fitness - scheda palestra, timer, storico e progressi">
  <title>Matteo Fitness</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden" aria-label="Indietro">←</button>
      <div><p class="eyebrow">MATTEO FITNESS</p><h1 id="pageTitle">Dashboard</h1></div>
      <button id="installBtn" class="icon-btn hidden" aria-label="Installa app">＋</button>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Navigazione principale">
      <button data-route="home" class="nav-item active"><span>⌂</span>Home</button>
      <button data-route="workouts" class="nav-item"><span>▤</span>Scheda</button>
      <button data-route="history" class="nav-item"><span>◷</span>Storico</button>
      <button data-route="progress" class="nav-item"><span>↗</span>Progressi</button>
    </nav>
  </div>

  <div id="timerBar" class="timer-bar hidden" role="status" aria-live="polite">
    <div><small>RECUPERO</small><strong id="timerText">01:30</strong></div>
    <button id="timerAdd" class="ghost-btn">+30s</button>
    <button id="timerStop" class="danger-btn">Stop</button>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
