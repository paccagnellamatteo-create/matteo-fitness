<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5146c7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Matteo Fitness"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Matteo Fitness</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;background:#f5f6f8;color:#171a20}header{padding:calc(20px + env(safe-area-inset-top)) 18px 20px;background:linear-gradient(135deg,#5146c7,#8077ee);color:white}main{max-width:520px;margin:auto;padding:16px 16px calc(90px + env(safe-area-inset-bottom))}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 3px 14px #18243a10}.day,.save,.nav{font:inherit}.day{width:100%;border:0;background:#fff;border-radius:18px;padding:17px;text-align:left;margin-bottom:10px}.exercise{border-top:1px solid #e7e9ed;padding:13px 0}.set{display:grid;grid-template-columns:38px 1fr 1fr;gap:7px;margin:7px 0}.set input{min-width:0;padding:11px;border:1px solid #dce0e6;border-radius:10px;text-align:center;font:inherit}.save{width:100%;border:0;background:#26a875;color:white;padding:13px;border-radius:12px;font-weight:700}.view{display:none}.view.on{display:block}.back{border:0;background:#eceafd;color:#5146c7;border-radius:10px;padding:9px 12px}.muted{font-size:12px;color:#747c89}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffffff5;border-top:1px solid #e4e6ea;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.nav{border:0;background:none;color:#747c89}.toast{position:fixed;left:20px;right:20px;bottom:90px;background:#181c24;color:#fff;padding:12px;border-radius:12px;text-align:center;display:none}.toast.on{display:block}@media(prefers-color-scheme:dark){body{background:#11151b;color:#f5f7fa}.card,.day{background:#1d232c;color:#f5f7fa}.set input{background:#151a20;color:#fff}.bottom{background:#1d232cf5}}</style></head><body><header><h1 style="margin:0;font-size:21px">MATTEO FITNESS</h1><div style="opacity:.82;font-size:12px">Allenati · Registra · Migliora</div></header><main><section id="home" class="view on"><div class="card"><strong>Archivio personale sul dispositivo</strong><div id="info" class="muted">Nessun esercizio registrato</div></div><h2>Allenamento</h2><button class="day" data-day="A"><b>🍑 Giorno A</b><div class="muted">Glutei · Dorso · Spalle · Bicipiti</div></button><button class="day" data-day="B"><b>💪 Giorno B</b><div class="muted">Braccia · Schiena · Glutei</div></button></section><section id="work" class="view"><button class="back" data-go="home">← Home</button><h2 id="title"></h2><div class="card" id="body"></div></section><section id="history" class="view"><h2>Storico</h2><div class="card" id="hist"></div></section><section id="data" class="view"><h2>Dati</h2><div class="card"><strong>Backup locale</strong><p class="muted">I dati sono conservati nel browser/PWA di questo dispositivo.</p><button id="export" class="back">Copia backup JSON</button></div></section></main><nav class="bottom"><button class="nav" data-go="home">⌂<br>Home</button><button class="nav" data-go="history">◷<br>Storico</button><button class="nav" data-go="data">⚙<br>Dati</button></nav><div id="toast" class="toast"></div><script>const db={A:[['Hip Thrust al multipower o con bilanciere',4,'8-10'],['Leg Press 45° (piedi alti e larghi)',3,'10-12'],['Lat Machine avanti',3,'10-12'],['Alzate laterali con manubri',4,'12-15'],['Face Pull ai cavi alti',3,'15'],['Curl con manubri su panca inclinata',3,'10-12'],['McGill Curl-Up + Bird-Dog',3,'10 + 10/lato']],B:[['Chest Supported Row',4,'8-10'],['Bulgarian Split Squat',3,'8-10/lato'],['Spinte manubri su panca a 75°',3,'10'],['French Press',3,'10-12'],['Abductor Machine',3,'15-20'],['Pushdown + Curl ai cavi',3,'12 + 12'],['Pallof Press + Plank',3,'12/lato + 40 sec']]};const key='matteoFitnessHistoryV1';let history=[];try{history=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){};const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];function go(id){qa('.view').forEach(v=>v.classList.toggle('on',v.id===id));if(id==='history')renderHistory()}function toast(t){q('#toast').textContent=t;q('#toast').classList.add('on');setTimeout(()=>q('#toast').classList.remove('on'),1500)}function refresh(){q('#info').textContent=history.length?history.length+' esercizi salvati':'Nessun esercizio registrato'}function persist(){localStorage.setItem(key,JSON.stringify(history));refresh();toast('Salvato sul dispositivo ✓')}function openDay(d){q('#title').textContent='Giorno '+d;q('#body').innerHTML=db[d].map((x,i)=>`<div class="exercise" data-day="${d}" data-i="${i}"><b>${i+1}. ${x[0]}</b><div class="muted">${x[1]} × ${x[2]}</div>${Array.from({length:x[1]},(_,n)=>`<div class="set"><b>S${n+1}</b><input inputmode="decimal" placeholder="KG"><input inputmode="numeric" placeholder="REPS"></div>`).join('')}<button class="save">Salva esercizio</button></div>`).join('');go('work')}function save(el){const ex=db[el.dataset.day][+el.dataset.i];const sets=[...el.querySelectorAll('.set')].map((s,i)=>{let a=s.querySelectorAll('input');return{serie:i+1,kg:parseFloat(a[0].value.replace(',','.'))||0,reps:parseInt(a[1].value)||0}}).filter(s=>s.kg||s.reps);if(!sets.length)return toast('Inserisci almeno una serie');history.push({id:Date.now(),date:new Date().toISOString(),day:el.dataset.day,name:ex[0],sets});persist()}function renderHistory(){q('#hist').innerHTML=history.length?history.slice().reverse().map(h=>`<div class="exercise"><b>${h.name}</b><div class="muted">${new Date(h.date).toLocaleDateString('it-IT')} · Giorno ${h.day}</div><div class="muted">${h.sets.map(s=>`${s.kg} kg × ${s.reps}`).join(' · ')}</div></div>`).join(''):'<div class="muted">Nessun allenamento registrato.</div>'}document.addEventListener('click',e=>{let d=e.target.closest('[data-day]');if(d)return openDay(d.dataset.day);let g=e.target.closest('[data-go]');if(g)return go(g.dataset.go);let s=e.target.closest('.save');if(s)return save(s.closest('.exercise'));if(e.target.closest('#export')){const t=JSON.stringify(history,null,2);navigator.clipboard?.writeText(t).then(()=>toast('Backup copiato')).catch(()=>toast('Copia non disponibile'))}});refresh();if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}</script></body></html>
